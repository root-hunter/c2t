name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy configurator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare site with release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p site/downloads
          cp -a docs/. site/
          release_tag="$(gh release view --json tagName --jq .tagName)"
          release_url="$(gh release view --json url --jq .url)"
          packages="${RUNNER_TEMP}/c2t-release-packages"
          extracted="${RUNNER_TEMP}/c2t-release-extracted"
          mkdir -p "${packages}" "${extracted}"

          linux_x64="c2t-${release_tag}-linux-musl-x86_64.tar.gz"
          linux_arm64="c2t-${release_tag}-linux-musl-aarch64.tar.gz"
          windows_x64="c2t-${release_tag}-windows-x86_64.zip"
          macos_x64="c2t-${release_tag}-macos-x86_64.tar.gz"
          macos_arm64="c2t-${release_tag}-macos-aarch64.tar.gz"
          gh release download "${release_tag}" \
            --pattern "${linux_x64}" \
            --pattern "${linux_arm64}" \
            --pattern "${windows_x64}" \
            --pattern "${macos_x64}" \
            --pattern "${macos_arm64}" \
            --dir "${packages}"

          mkdir -p "${extracted}/linux-x64" \
            "${extracted}/linux-arm64" "${extracted}/windows-x64" \
            "${extracted}/macos-x64" "${extracted}/macos-arm64"
          tar -xzf "${packages}/${linux_x64}" \
            --strip-components=1 -C "${extracted}/linux-x64"
          tar -xzf "${packages}/${linux_arm64}" \
            --strip-components=1 -C "${extracted}/linux-arm64"
          unzip -q "${packages}/${windows_x64}" \
            -d "${extracted}/windows-x64"
          tar -xzf "${packages}/${macos_x64}" \
            --strip-components=1 -C "${extracted}/macos-x64"
          tar -xzf "${packages}/${macos_arm64}" \
            --strip-components=1 -C "${extracted}/macos-arm64"

          install -m755 "${extracted}/linux-x64/c2t" \
            site/downloads/c2t-linux-x86_64
          install -m755 "${extracted}/linux-arm64/c2t" \
            site/downloads/c2t-linux-aarch64
          install -m644 "${extracted}/windows-x64/c2t-${release_tag}-windows-x86_64/c2t.exe" \
            site/downloads/c2t-windows-x86_64.exe
          install -m755 "${extracted}/macos-x64/c2t" \
            site/downloads/c2t-macos-x86_64
          install -m755 "${extracted}/macos-arm64/c2t" \
            site/downloads/c2t-macos-aarch64

          linux_size="$(stat -c %s site/downloads/c2t-linux-x86_64)"
          linux_arm64_size="$(stat -c %s site/downloads/c2t-linux-aarch64)"
          windows_size="$(stat -c %s site/downloads/c2t-windows-x86_64.exe)"
          macos_x64_size="$(stat -c %s site/downloads/c2t-macos-x86_64)"
          macos_arm64_size="$(stat -c %s site/downloads/c2t-macos-aarch64)"
          printf '%s\n' \
            '{' \
            "  \"tag_name\": \"${release_tag}\"," \
            "  \"html_url\": \"${release_url}\"," \
            '  "assets": [' \
            "    {\"name\":\"c2t-linux-x86_64\",\"browser_download_url\":\"downloads/c2t-linux-x86_64\",\"size\":${linux_size}}," \
            "    {\"name\":\"c2t-linux-aarch64\",\"browser_download_url\":\"downloads/c2t-linux-aarch64\",\"size\":${linux_arm64_size}}," \
            "    {\"name\":\"c2t-windows-x86_64.exe\",\"browser_download_url\":\"downloads/c2t-windows-x86_64.exe\",\"size\":${windows_size}}," \
            "    {\"name\":\"c2t-macos-x86_64\",\"browser_download_url\":\"downloads/c2t-macos-x86_64\",\"size\":${macos_x64_size}}," \
            "    {\"name\":\"c2t-macos-aarch64\",\"browser_download_url\":\"downloads/c2t-macos-aarch64\",\"size\":${macos_arm64_size}}" \
            '  ]' \
            '}' > site/release.json

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
