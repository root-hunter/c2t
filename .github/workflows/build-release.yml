name: Build and release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release tag against CMake version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tags must use SemVer, for example v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          cmake_version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          tag_version="${tag#v}"
          tag_version="${tag_version%%-*}"
          if [[ -z "${cmake_version}" || "${tag_version}" != "${cmake_version}" ]]; then
            echo "Tag ${tag} does not match CMake project version ${cmake_version:-<missing>}" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-musl
            arch: x86_64
            runner: ubuntu-24.04
          - platform: linux-musl
            arch: aarch64
            runner: ubuntu-24.04-arm
          - platform: linux-glibc
            arch: x86_64
            runner: ubuntu-24.04
          - platform: linux-glibc
            arch: aarch64
            runner: ubuntu-24.04-arm
          - platform: windows
            arch: x86_64
            runner: ubuntu-24.04
          - platform: macos
            arch: x86_64
            runner: macos-15-intel
          - platform: macos
            arch: aarch64
            runner: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install glibc build dependencies
        if: matrix.platform == 'linux-glibc'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            cmake \
            gcc \
            libssl-dev \
            libxau-dev \
            libxcb1-dev \
            libxdmcp-dev \
            libzstd-dev \
            ninja-build \
            nodejs \
            python3

      - name: Install Windows build dependencies
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            cmake \
            mingw-w64 \
            ninja-build \
            nodejs \
            zip

      - name: Build and test Linux with musl
        if: matrix.platform == 'linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/linux-musl
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --volume "${GITHUB_WORKSPACE}/build/linux-musl:/build" \
            --workdir /src \
            alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d \
            sh -euxc '
              apk add --no-cache \
                build-base \
                cmake \
                libxau-dev \
                libxcb-dev \
                libxcb-static \
                libxdmcp-dev \
                linux-headers \
                ninja \
                nodejs \
                openssl-dev \
                openssl-libs-static \
                perl \
                python3 \
                zstd-dev \
                zstd-static
              cmake -S /src -B /build -G Ninja \
                -DCMAKE_BUILD_TYPE=MinSizeRel \
                -DBUILD_TESTING=ON
              cmake --build /build --parallel 2
              ctest --test-dir /build --output-on-failure
            '

      - name: Configure Linux with glibc
        if: matrix.platform == 'linux-glibc'
        run: >-
          cmake -S . -B build/linux-glibc -G Ninja
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DBUILD_TESTING=ON
          -DC2T_STANDALONE_LINUX=OFF

      - name: Configure Windows
        if: matrix.platform == 'windows'
        run: >-
          cmake -S . -B build/windows -G Ninja
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DBUILD_TESTING=OFF
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake

      - name: Configure macOS
        if: matrix.platform == 'macos'
        run: >-
          cmake -S . -B build/macos -G Ninja
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DBUILD_TESTING=ON

      - name: Build
        if: matrix.platform != 'linux-musl'
        run: cmake --build build/${{ matrix.platform }} --parallel 2

      - name: Test Linux with glibc
        if: matrix.platform == 'linux-glibc'
        run: ctest --test-dir build/linux-glibc --output-on-failure

      - name: Test macOS
        if: matrix.platform == 'macos'
        run: ctest --test-dir build/macos --output-on-failure

      - name: Test browser provisioner on Windows binary
        if: matrix.platform == 'windows'
        run: node tests/browser_provision_test.mjs build/windows/c2t.exe

      - name: Package Linux with musl
        if: matrix.platform == 'linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          package="c2t-v${version}-linux-musl-${{ matrix.arch }}"
          install -Dm755 build/linux-musl/c2t "stage/${package}/c2t"
          install -Dm644 README.md "stage/${package}/README.md"
          mkdir -p dist
          tar -C stage -czf "dist/${package}.tar.gz" "${package}"

      - name: Package Linux with glibc
        if: matrix.platform == 'linux-glibc'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          package="c2t-v${version}-linux-glibc-${{ matrix.arch }}"
          install -Dm755 build/linux-glibc/c2t "stage/${package}/c2t"
          install -Dm644 README.md "stage/${package}/README.md"
          mkdir -p dist
          tar -C stage -czf "dist/${package}.tar.gz" "${package}"

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          package="c2t-v${version}-windows-x86_64"
          install -Dm644 build/windows/c2t.exe "stage/${package}/c2t.exe"
          install -Dm644 README.md "stage/${package}/README.md"
          mkdir -p dist
          (cd stage && zip -9 -r "../dist/${package}.zip" "${package}")

      - name: Package macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          package="c2t-v${version}-macos-${{ matrix.arch }}"
          codesign --force --sign - build/macos/c2t
          install -m755 build/macos/c2t "stage/${package}/c2t"
          install -m644 README.md "stage/${package}/README.md"
          mkdir -p dist
          tar -C stage -czf "dist/${package}.tar.gz" "${package}"

      - name: Verify Linux package permissions
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/package-mode-check"
          tar -xzf dist/*.tar.gz -C "${RUNNER_TEMP}/package-mode-check"
          test -x "${RUNNER_TEMP}"/package-mode-check/*/c2t

      - name: Verify macOS package and signature
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/package-mode-check"
          tar -xzf dist/*.tar.gz -C "${RUNNER_TEMP}/package-mode-check"
          binary="$(find "${RUNNER_TEMP}/package-mode-check" -type f -name c2t)"
          test -x "${binary}"
          codesign --verify --strict "${binary}"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C sha256sum c2t-* > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* "${args[@]}"

      - name: Refresh GitHub Pages downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
