name: Build and release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check release tag against CMake version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tags must use SemVer, for example v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          cmake_version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          tag_version="${tag#v}"
          tag_version="${tag_version%%-*}"
          if [[ -z "${cmake_version}" || "${tag_version}" != "${cmake_version}" ]]; then
            echo "Tag ${tag} does not match CMake project version ${cmake_version:-<missing>}" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }} (${{ matrix.variant }})
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-musl
            arch: x86_64
            runner: ubuntu-24.04
            variant: native
          - platform: linux-musl
            arch: aarch64
            runner: ubuntu-24.04-arm
            variant: native
          - platform: linux-glibc
            arch: x86_64
            runner: ubuntu-24.04
            variant: native
          - platform: linux-glibc
            arch: aarch64
            runner: ubuntu-24.04-arm
            variant: native
          - platform: windows
            arch: x86_64
            runner: windows-2025-vs2026
            variant: msvc
          - platform: windows
            arch: aarch64
            runner: windows-11-vs2026-arm
            variant: msvc
          - platform: windows
            arch: x86_64
            runner: ubuntu-24.04
            variant: mingw-wine
          - platform: macos
            arch: x86_64
            runner: macos-26-intel
            variant: native
          - platform: macos
            arch: aarch64
            runner: macos-26
            variant: native

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install glibc build dependencies
        if: matrix.platform == 'linux-glibc'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang \
            lld \
            cmake \
            libssl-dev \
            libxau-dev \
            libxcb1-dev \
            libxdmcp-dev \
            libzstd-dev \
            ninja-build \
            nodejs \
            python3

      - name: Install Windows cross-build dependencies
        if: matrix.platform == 'windows' && matrix.variant == 'mingw-wine'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            cmake \
            mingw-w64 \
            ninja-build \
            nodejs \
            wine \
            zip

      - name: Build and test Linux with musl
        if: matrix.platform == 'linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/linux-musl
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --volume "${GITHUB_WORKSPACE}/build/linux-musl:/build" \
            --workdir /src \
            alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d \
            sh -euxc '
              apk add --no-cache \
                build-base \
                clang \
                lld \
                cmake \
                libxau-dev \
                libxcb-dev \
                libxcb-static \
                libxdmcp-dev \
                linux-headers \
                ninja \
                nodejs \
                openssl-dev \
                openssl-libs-static \
                perl \
                python3 \
                zstd-dev \
                zstd-static
              cmake -S /src -B /build -G Ninja \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=ON
              cmake --build /build --parallel 2
              ctest --test-dir /build --output-on-failure
              /build/perf_bench --markdown-out /build/perf_report.md --json-out /build/perf_report.json
            '

      - name: Configure Linux with glibc
        if: matrix.platform == 'linux-glibc'
        run: >-
          cmake -S . -B build/linux-glibc -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DC2T_STANDALONE_LINUX=OFF

      - name: Configure native Windows
        if: matrix.platform == 'windows' && matrix.variant == 'msvc'
        run: >-
          cmake -S . -B build/windows -G "Visual Studio 18 2026"
          -A ${{ matrix.arch == 'aarch64' && 'ARM64' || 'x64' }}
          -DBUILD_TESTING=ON
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_OBJDUMP="C:/Program Files/LLVM/bin/llvm-objdump.exe"

      - name: Configure Windows cross-build
        if: matrix.platform == 'windows' && matrix.variant == 'mingw-wine'
        shell: bash
        run: >-
          cmake -S . -B build/windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake

      - name: Configure macOS
        if: matrix.platform == 'macos'
        run: >-
          cmake -S . -B build/macos -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}

      - name: Build
        if: matrix.platform != 'linux-musl' && matrix.platform != 'windows'
        run: cmake --build build/${{ matrix.platform }} --parallel 2

      - name: Build native Windows
        if: matrix.platform == 'windows' && matrix.variant == 'msvc'
        run: cmake --build build/windows --config Release --parallel 2

      - name: Build Windows cross-build
        if: matrix.platform == 'windows' && matrix.variant == 'mingw-wine'
        shell: bash
        run: cmake --build build/windows --parallel 2

      - name: Test Linux with glibc
        if: matrix.platform == 'linux-glibc'
        run: ctest --test-dir build/linux-glibc --output-on-failure

      - name: Test macOS
        if: matrix.platform == 'macos'
        run: ctest --test-dir build/macos --output-on-failure

      - name: Test browser provisioner on native Windows binary
        if: matrix.platform == 'windows' && matrix.variant == 'msvc'
        run: node tests/browser_provision_test.mjs build/windows/Release/c2t.exe

      - name: Test browser provisioner on Windows cross-build
        if: matrix.platform == 'windows' && matrix.variant == 'mingw-wine'
        shell: bash
        run: node tests/browser_provision_test.mjs build/windows/c2t.exe

      - name: Run benchmark (Linux glibc & macOS)
        if: matrix.platform == 'linux-glibc' || matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          ./build/${{ matrix.platform }}/perf_bench --markdown-out perf_report.md --json-out perf_report.json
          echo "## Benchmark Results (${{ matrix.platform }} ${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          cat perf_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report benchmark for Linux musl
        if: matrix.platform == 'linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          cp build/linux-musl/perf_report.md perf_report.md
          cp build/linux-musl/perf_report.json perf_report.json
          echo "## Benchmark Results (${{ matrix.platform }} ${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          cat perf_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run benchmark on native Windows
        if: matrix.platform == 'windows' && matrix.variant == 'msvc'
        shell: pwsh
        run: |
          & .\build\windows\Release\perf_bench.exe --markdown-out perf_report.md --json-out perf_report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "## Benchmark Results (${{ matrix.platform }} ${{ matrix.arch }}, ${{ matrix.variant }})" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content perf_report.md |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Run Windows cross-build benchmark via Wine
        if: matrix.platform == 'windows' && matrix.variant == 'mingw-wine'
        shell: bash
        run: |
          set -euo pipefail
          wine build/windows/perf_bench.exe --markdown-out perf_report.md --json-out perf_report.json
          echo "## Benchmark Results (${{ matrix.platform }} ${{ matrix.arch }}, ${{ matrix.variant }})" >> "$GITHUB_STEP_SUMMARY"
          cat perf_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}
          path: |
            perf_report.md
            perf_report.json
          if-no-files-found: ignore

      - name: Package Linux with musl
        if: matrix.platform == 'linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          package="c2t-v${version}-linux-musl-${{ matrix.arch }}"
          install -Dm755 build/linux-musl/c2t "stage/${package}/c2t"
          install -Dm644 README.md "stage/${package}/README.md"
          mkdir -p dist
          tar -C stage -czf "dist/${package}.tar.gz" "${package}"

      - name: Package Linux with glibc
        if: matrix.platform == 'linux-glibc'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          package="c2t-v${version}-linux-glibc-${{ matrix.arch }}"
          install -Dm755 build/linux-glibc/c2t "stage/${package}/c2t"
          install -Dm644 README.md "stage/${package}/README.md"
          mkdir -p dist
          tar -C stage -czf "dist/${package}.tar.gz" "${package}"

      - name: Package native Windows
        if: matrix.platform == 'windows' && matrix.variant == 'msvc'
        shell: pwsh
        run: |
          $project = Get-Content CMakeLists.txt -Raw
          if ($project -notmatch 'project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Unable to read the project version from CMakeLists.txt"
          }
          $target = if ("${{ matrix.arch }}" -eq "aarch64") {
            "windows-aarch64"
          } else {
            "windows-msvc-x86_64"
          }
          $package = "c2t-v$($Matches[1])-$target"
          New-Item -ItemType Directory -Force "stage/$package", dist | Out-Null
          Copy-Item build/windows/Release/c2t.exe "stage/$package/c2t.exe"
          Copy-Item README.md "stage/$package/README.md"
          Compress-Archive -Path "stage/$package" -DestinationPath "dist/$package.zip" -CompressionLevel Optimal

      - name: Package Windows cross-build
        if: matrix.platform == 'windows' && matrix.variant == 'mingw-wine'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          package="c2t-v${version}-windows-x86_64"
          install -Dm644 build/windows/c2t.exe "stage/${package}/c2t.exe"
          install -Dm644 README.md "stage/${package}/README.md"
          mkdir -p dist
          (cd stage && zip -9 -r "../dist/${package}.zip" "${package}")

      - name: Package macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          package="c2t-v${version}-macos-${{ matrix.arch }}"
          codesign --force --sign - build/macos/c2t
          mkdir -p "stage/${package}" dist
          install -m755 build/macos/c2t "stage/${package}/c2t"
          install -m644 README.md "stage/${package}/README.md"
          tar -C stage -czf "dist/${package}.tar.gz" "${package}"

      - name: Verify Linux package permissions
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/package-mode-check"
          tar -xzf dist/*.tar.gz -C "${RUNNER_TEMP}/package-mode-check"
          test -x "${RUNNER_TEMP}"/package-mode-check/*/c2t

      - name: Verify macOS package and signature
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/package-mode-check"
          tar -xzf dist/*.tar.gz -C "${RUNNER_TEMP}/package-mode-check"
          binary="$(find "${RUNNER_TEMP}/package-mode-check" -type f -name c2t)"
          test -x "${binary}"
          codesign --verify --strict "${binary}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  virustotal-scan:
    name: VirusTotal artifact scan
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install VirusTotal Python client
        run: pip install vt-py

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Scan Windows executable with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Scan only the x86_64 MinGW build produced on Ubuntu and tested via Wine.
          shopt -s nullglob
          packages=(dist/c2t-v*-windows-x86_64.zip)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "[!] Expected exactly one Ubuntu/MinGW Windows package, found ${#packages[@]}." >&2
            exit 1
          fi

          unzip -o "${packages[0]}" -d dist/win_mingw_unpacked
          exe_file="$(find dist/win_mingw_unpacked -type f -name 'c2t.exe' -print -quit)"
          if [[ -z "${exe_file}" ]]; then
            echo "[!] c2t.exe is missing from ${packages[0]}." >&2
            exit 1
          fi

          python3 tools/vt_scan.py "${exe_file}" --output-markdown virustotal-report.md || true


          # If on a release tag, append VT report to GitHub Release notes asynchronously
          if [[ "${GITHUB_REF}" == refs/tags/* && -f virustotal-report.md ]]; then
            echo "[*] Updating GitHub Release notes with VirusTotal scan results..."
            current_notes="$(gh release view "${GITHUB_REF_NAME}" --json body --jq '.body' 2>/dev/null || true)"
            if [[ -n "${current_notes}" ]]; then
              base_notes="${current_notes%%## 🛡️ VirusTotal Security Verification Report*}"
              base_notes="$(printf "%s" "${base_notes}" | sed -e 's/[[:space:]]*$//' -e 's/---*$//' -e 's/[[:space:]]*$//')"
              printf "%s\n\n---\n\n" "${base_notes}" > updated_notes.md
              cat virustotal-report.md >> updated_notes.md
              gh release edit "${GITHUB_REF_NAME}" --notes-file updated_notes.md || true
            fi
          fi

      - name: Upload VirusTotal report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virustotal-report
          path: virustotal-report.md
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C sha256sum c2t-* > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists. Updating release assets..."
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            echo "Creating release ${GITHUB_REF_NAME}..."
            args=(--verify-tag --generate-notes)
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "${GITHUB_REF_NAME}" dist/* "${args[@]}"
          fi

      - name: Refresh GitHub Pages downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
