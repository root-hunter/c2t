name: Build and release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release tag against CMake version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tags must use SemVer, for example v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          cmake_version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          tag_version="${tag#v}"
          tag_version="${tag_version%%-*}"
          if [[ -z "${cmake_version}" || "${tag_version}" != "${cmake_version}" ]]; then
            echo "Tag ${tag} does not match CMake project version ${cmake_version:-<missing>}" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }} x86_64
    needs: validate-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          - windows

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            cmake \
            gcc \
            libssl-dev \
            libxau-dev \
            libxcb1-dev \
            libxdmcp-dev \
            libzstd-dev \
            mingw-w64 \
            ninja-build \
            nodejs \
            python3 \
            zip

      - name: Configure Linux
        if: matrix.platform == 'linux'
        run: >-
          cmake -S . -B build/linux -G Ninja
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DBUILD_TESTING=ON

      - name: Configure Windows
        if: matrix.platform == 'windows'
        run: >-
          cmake -S . -B build/windows -G Ninja
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DBUILD_TESTING=OFF
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake

      - name: Build
        run: cmake --build build/${{ matrix.platform }} --parallel 2

      - name: Test Linux
        if: matrix.platform == 'linux'
        run: ctest --test-dir build/linux --output-on-failure

      - name: Test browser provisioner on Windows binary
        if: matrix.platform == 'windows'
        run: node tests/browser_provision_test.mjs build/windows/c2t.exe

      - name: Package Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          package="c2t-v${version}-linux-x86_64"
          install -Dm755 build/linux/c2t "stage/${package}/c2t"
          install -Dm644 README.md "stage/${package}/README.md"
          mkdir -p dist
          install -Dm755 build/linux/c2t dist/c2t-linux-x86_64
          tar -C stage -czf "dist/${package}.tar.gz" "${package}"

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(c2t VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          package="c2t-v${version}-windows-x86_64"
          install -Dm644 build/windows/c2t.exe "stage/${package}/c2t.exe"
          install -Dm644 README.md "stage/${package}/README.md"
          mkdir -p dist
          install -Dm644 build/windows/c2t.exe dist/c2t-windows-x86_64.exe
          (cd stage && zip -9 -r "../dist/${package}.zip" "${package}")

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.platform }}-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C sha256sum c2t-* > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* "${args[@]}"
