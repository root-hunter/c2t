<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wing-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Dark Navy Squircle Background -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#2563eb" stroke-width="8" stroke-opacity="0.7"/>

  <!-- Minimalist Telegram Paper Plane -->
  <g id="plane">
    <!-- Left Wing (Bright Crisp White) -->
    <polygon points="130,310 380,130 230,305" fill="#ffffff"/>
    
    <!-- Right Wing (Electric Sky Blue) -->
    <polygon points="230,305 380,130 270,390" fill="url(#wing-right)"/>
    
    <!-- Under Fold Shading (Telegram Dark Blue) -->
    <polygon points="230,305 270,390 300,315" fill="#0e57d9"/>
  </g>
</svg>
